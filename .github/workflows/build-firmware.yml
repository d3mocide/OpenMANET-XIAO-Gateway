name: Build firmware and deploy web flasher

on:
  push:
    branches: [main]
  # Build on PRs too. Without this a branch can be broken all the way to merge
  # and the first sign of it is a failed deploy on main - which is also the
  # moment the web flasher stops getting new firmware. PRs build but never
  # deploy.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keyed by ref so a PR build doesn't cancel main's deploy, or vice versa.
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # One build, US only. This used to be a 9-region matrix over
  # country-configs/*.defaults; the hardware doesn't support the other eight.
  # The FGH100M-H is a 902-928 MHz part (Quectel product page; Seeed's spec
  # table), and Morse Micro's own morse-firmware/WHENCE.md L51-54 names the
  # BCF this firmware loads - bcf_fgh100mhaamd.bin, pinned by CONFIG_MM_BCF_FILE
  # - as "FGH100M-H (US)". See design/HARDWARE.md "Regulatory domain" for the
  # full evidence and the per-region breakdown.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Builds inside the official espressif/idf Docker image for the pinned
      # version - avoids the local-toolchain gotchas found setting this up by
      # hand: missing libusb for openocd, the Python venv step silently not
      # completing, etc.
      # CONFIG_HALOW_COUNTRY_CODE="US" comes straight from sdkconfig.defaults,
      # so this is a plain build with no SDKCONFIG_DEFAULTS layering.
      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
          path: "."
          command: idf.py build

      - name: Assemble manifest + binaries
        run: |
          set -eu
          mkdir -p site
          cp build/bootloader/bootloader.bin site/
          cp build/partition_table/partition-table.bin site/
          cp build/ota_data_initial.bin site/
          cp build/xiao_halow_gateway.bin site/

          # The offsets below MUST match partitions.csv. They are not the
          # defaults: this is a dual-OTA layout, so the app lives at 0x20000
          # (131072) rather than the 0x10000 a single-app table would use, and
          # otadata at 0x10000 (65536) gets the generated ota_data_initial.bin
          # so a freshly flashed board boots ota_0 instead of chasing stale
          # OTA state left in flash. Getting these wrong yields a flash that
          # reports success and then doesn't boot, so assert them against the
          # build's own flash_args rather than trusting this heredoc.
          BOOTLOADER_OFFSET=0
          PARTITION_TABLE_OFFSET=32768
          OTADATA_OFFSET=65536
          APP_OFFSET=131072

          # Match offset AND filename together on the same flash_args line.
          # Checking the offset alone is not enough: with the app at the old
          # 0x10000 that check still passes, because otadata now occupies
          # 0x10000 - i.e. it would wave through the exact regression this
          # guard exists to catch.
          check_part() {
            offset="$(printf '0x%x' "$1")"
            file="$2"
            if ! grep -qiE "^${offset}[[:space:]]+(.*/)?${file}\$" build/flash_args; then
              echo "::error::flash_args has no '${file}' at ${offset}; partitions.csv and this manifest disagree"
              cat build/flash_args
              exit 1
            fi
          }
          check_part "$BOOTLOADER_OFFSET" bootloader.bin
          check_part "$PARTITION_TABLE_OFFSET" partition-table.bin
          check_part "$OTADATA_OFFSET" ota_data_initial.bin
          check_part "$APP_OFFSET" xiao_halow_gateway.bin

          VERSION="$(git describe --tags --always --dirty 2>/dev/null || git rev-parse --short HEAD)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          FULL_SHA="$(git rev-parse HEAD)"
          COMMIT_DATE="$(git log -1 --format=%cI)"
          COMMIT_TITLE="$(git log -1 --format=%s)"

          # Create directory for this specific build
          BUILD_DIR="site/builds/${SHORT_SHA}"
          mkdir -p "${BUILD_DIR}"
          cp site/bootloader.bin site/partition-table.bin site/ota_data_initial.bin site/xiao_halow_gateway.bin "${BUILD_DIR}/"

          # Manifest in build folder (relative paths resolve within builds/<sha>/)
          cat > "${BUILD_DIR}/manifest.json" <<EOF
          {
            "name": "XIAO HaLow Gateway (US) [${SHORT_SHA}]",
            "version": "${VERSION}",
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "bootloader.bin", "offset": ${BOOTLOADER_OFFSET} },
                  { "path": "partition-table.bin", "offset": ${PARTITION_TABLE_OFFSET} },
                  { "path": "ota_data_initial.bin", "offset": ${OTADATA_OFFSET} },
                  { "path": "xiao_halow_gateway.bin", "offset": ${APP_OFFSET} }
                ]
              }
            ]
          }
          EOF

          # Root manifest for backwards compatibility
          cp "${BUILD_DIR}/manifest.json" site/manifest.json

          # Current build metadata
          python3 -c "
          import json
          data = {
              'id': '${SHORT_SHA}',
              'version': '${VERSION}',
              'sha': '${SHORT_SHA}',
              'fullSha': '${FULL_SHA}',
              'date': '${COMMIT_DATE}',
              'title': '''${COMMIT_TITLE}''',
              'manifest': 'builds/${SHORT_SHA}/manifest.json'
          }
          with open('site/current-build.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: site

  # Publishing steps only. A PR build stops after `build` above: it proves the
  # firmware compiles without touching the live flasher page.
  assemble:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: site

      - name: Restore builds history cache
        uses: actions/cache/restore@v4
        id: restore-builds-cache
        with:
          path: build_history
          key: firmware-build-history-${{ github.run_id }}
          restore-keys: |
            firmware-build-history-

      - name: Merge build history and generate builds.json
        run: |
          python3 - <<'EOF'
          import json, os, shutil

          with open('site/current-build.json', 'r') as f:
              current = json.load(f)

          current_sha = current['sha']

          prev_builds = []
          history_file = 'build_history/builds.json'
          if os.path.exists(history_file):
              try:
                  with open(history_file, 'r') as f:
                      hist = json.load(f)
                      prev_builds = hist.get('builds', [])
              except Exception as e:
                  print(f"Warning: could not read history: {e}")

          # Deduplicate against current build
          filtered_prev = [b for b in prev_builds if b.get('sha') != current_sha]

          # Keep current + up to 3 previous builds = 4 builds total
          selected_builds = [current] + filtered_prev[:3]

          for idx, b in enumerate(selected_builds):
              b['isLatest'] = (idx == 0)
              if idx == 0:
                  b['tag'] = 'Latest'
              else:
                  b['tag'] = f"Previous (n-{idx})"

          # Copy cached previous builds to site/builds/
          os.makedirs('site/builds', exist_ok=True)
          for b in selected_builds[1:]:
              sha = b.get('sha')
              src = os.path.join('build_history', 'builds', sha)
              dst = os.path.join('site', 'builds', sha)
              if os.path.isdir(src) and not os.path.exists(dst):
                  shutil.copytree(src, dst)

          # Write site builds.json
          index_data = {
              'latest': current_sha,
              'builds': selected_builds
          }
          with open('site/builds.json', 'w') as f:
              json.dump(index_data, f, indent=2)

          # Update build_history for caching
          os.makedirs('build_history/builds', exist_ok=True)
          with open('build_history/builds.json', 'w') as f:
              json.dump(index_data, f, indent=2)

          current_build_dir = os.path.join('site', 'builds', current_sha)
          hist_current_dir = os.path.join('build_history', 'builds', current_sha)
          if os.path.isdir(current_build_dir):
              if os.path.exists(hist_current_dir):
                  shutil.rmtree(hist_current_dir)
              shutil.copytree(current_build_dir, hist_current_dir)

          # Prune expired builds from build_history
          valid_shas = {b.get('sha') for b in selected_builds}
          for item in os.listdir('build_history/builds'):
              if item not in valid_shas:
                  p = os.path.join('build_history', 'builds', item)
                  if os.path.isdir(p):
                      shutil.rmtree(p)
          EOF

      - name: Save builds history cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: build_history
          key: firmware-build-history-${{ github.run_id }}

      - name: Add flasher page
        run: cp docs/index.html site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: assemble
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
