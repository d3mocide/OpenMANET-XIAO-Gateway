name: Build firmware and deploy web flasher

on:
  push:
    branches: [main]
    tags: ['v*']
  # Build on PRs too. Without this a branch can be broken all the way to merge
  # and the first sign of it is a failed deploy on main - which is also the
  # moment the web flasher stops getting new firmware. PRs build but never
  # deploy.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keyed by ref so a PR build doesn't cancel main's deploy, or vice versa.
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # One build, US only. This used to be a 9-region matrix over
  # country-configs/*.defaults; the hardware doesn't support the other eight.
  # The FGH100M-H is a 902-928 MHz part (Quectel product page; Seeed's spec
  # table), and Morse Micro's own morse-firmware/WHENCE.md L51-54 names the
  # BCF this firmware loads - bcf_fgh100mhaamd.bin, pinned by CONFIG_MM_BCF_FILE
  # - as "FGH100M-H (US)". See design/HARDWARE.md "Regulatory domain" for the
  # full evidence and the per-region breakdown.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Most of this build is not this project's code - CONFIG_HALOW_AP_MODE=y
      # pulls in esp-halow's vendored wpa_supplicant/hostapd fork - and none of
      # it changes between pushes, so compiling it from scratch every time is
      # the bulk of the wall clock on a one-line firmware change.
      #
      # ccache lives inside the workspace rather than in $HOME because of how
      # esp-idf-ci-action runs: it mounts only $GITHUB_WORKSPACE into the
      # container (`-v "${GITHUB_WORKSPACE}:/app/${{ github.repository }}"`, see
      # that action's action.yml), so a cache restored to the runner's home
      # directory would be invisible to the compiler. A workspace path is
      # visible on both sides, which is what makes actions/cache work here at
      # all. ccache itself is already installed in the espressif/idf image
      # (esp-idf tools/docker/Dockerfile lists it in the apt install block).
      - name: Restore ccache
        uses: actions/cache/restore@v4
        id: restore-ccache
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-idf5.5.1-esp32s3-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-idf5.5.1-esp32s3-

      # Builds inside the official espressif/idf Docker image for the pinned
      # version - avoids the local-toolchain gotchas found setting this up by
      # hand: missing libusb for openocd, the Python venv step silently not
      # completing, etc.
      # CONFIG_HALOW_COUNTRY_CODE="US" comes straight from sdkconfig.defaults,
      # so this is a plain build with no SDKCONFIG_DEFAULTS layering.
      #
      # IDF_CCACHE_ENABLE is the environment variable behind `idf.py --ccache`
      # ("Use ccache in build. Disabled by default." - esp-idf v5.5.1,
      # tools/idf_py_actions/core_ext.py L380-383), so it has to be passed into
      # the container; extra_docker_args is the action's hook for that.
      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
          path: "."
          extra_docker_args: >-
            -e IDF_CCACHE_ENABLE=1
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
            -e CCACHE_MAXSIZE=500M
          command: idf.py build

      # save/restore rather than the combined action: the key is pinned to the
      # commit SHA so every build writes a fresh entry (GitHub's cache entries
      # are immutable, so a fixed key would go stale after the first run and
      # never pick up newly compiled objects), and the restore-keys prefix above
      # is what makes the previous build's cache the starting point.
      - name: Save ccache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-idf5.5.1-esp32s3-${{ github.sha }}

      - name: Assemble manifest + binaries
        run: |
          set -eu
          mkdir -p site
          cp build/bootloader/bootloader.bin site/
          cp build/partition_table/partition-table.bin site/
          cp build/ota_data_initial.bin site/
          cp build/xiao_halow_gateway.bin site/

          BOOTLOADER_OFFSET=0
          PARTITION_TABLE_OFFSET=32768
          OTADATA_OFFSET=65536
          APP_OFFSET=131072

          check_part() {
            offset="$(printf '0x%x' "$1")"
            file="$2"
            if ! grep -qiE "^${offset}[[:space:]]+(.*/)?${file}\$" build/flash_args; then
              echo "::error::flash_args has no '${file}' at ${offset}; partitions.csv and this manifest disagree"
              cat build/flash_args
              exit 1
            fi
          }
          check_part "$BOOTLOADER_OFFSET" bootloader.bin
          check_part "$PARTITION_TABLE_OFFSET" partition-table.bin
          check_part "$OTADATA_OFFSET" ota_data_initial.bin
          check_part "$APP_OFFSET" xiao_halow_gateway.bin

          SHORT_SHA="$(git rev-parse --short HEAD)"
          FULL_SHA="$(git rev-parse HEAD)"
          COMMIT_DATE="$(git log -1 --format=%cI)"
          COMMIT_TITLE="$(git log -1 --format=%s)"

          # Check if this is a tag release
          REF_NAME="${{ github.ref_name }}"
          REF_TYPE="${{ github.ref_type }}"

          if [ "${REF_TYPE}" = "tag" ] || echo "${REF_NAME}" | grep -qE '^v[0-9]'; then
            IS_RELEASE="true"
            VERSION="${REF_NAME}"
            BUILD_ID="${REF_NAME}"
          else
            IS_RELEASE="false"
            VERSION="dev-${SHORT_SHA}"
            BUILD_ID="dev-${SHORT_SHA}"
          fi

          BUILD_DIR="site/builds/${BUILD_ID}"
          mkdir -p "${BUILD_DIR}"
          cp site/bootloader.bin site/partition-table.bin site/ota_data_initial.bin site/xiao_halow_gateway.bin "${BUILD_DIR}/"

          cat > "${BUILD_DIR}/manifest.json" <<EOF
          {
            "name": "XIAO HaLow Gateway (US) [${VERSION}]",
            "version": "${VERSION}",
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "bootloader.bin", "offset": ${BOOTLOADER_OFFSET} },
                  { "path": "partition-table.bin", "offset": ${PARTITION_TABLE_OFFSET} },
                  { "path": "ota_data_initial.bin", "offset": ${OTADATA_OFFSET} },
                  { "path": "xiao_halow_gateway.bin", "offset": ${APP_OFFSET} }
                ]
              }
            ]
          }
          EOF

          # Root manifest default
          cp "${BUILD_DIR}/manifest.json" site/manifest.json

          export BUILD_ID VERSION SHORT_SHA FULL_SHA COMMIT_DATE COMMIT_TITLE IS_RELEASE
          python3 -c "
          import json, os
          data = {
              'id': os.environ['BUILD_ID'],
              'version': os.environ['VERSION'],
              'sha': os.environ['SHORT_SHA'],
              'fullSha': os.environ['FULL_SHA'],
              'date': os.environ['COMMIT_DATE'],
              'title': os.environ['COMMIT_TITLE'],
              'isRelease': os.environ['IS_RELEASE'].lower() == 'true',
              'manifest': f'builds/{os.environ[\"BUILD_ID\"]}/manifest.json'
          }
          with open('site/current-build.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: site

  assemble:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: site

      - name: Restore builds history cache
        uses: actions/cache/restore@v4
        id: restore-builds-cache
        with:
          path: build_history
          key: firmware-build-history-${{ github.run_id }}
          restore-keys: |
            firmware-build-history-

      - name: Merge build history (Releases vs Dev)
        run: |
          python3 - <<'EOF'
          import json, os, shutil

          with open('site/current-build.json', 'r') as f:
              current = json.load(f)

          history_file = 'build_history/builds.json'
          hist = {'releases': [], 'devBuilds': []}
          if os.path.exists(history_file):
              try:
                  with open(history_file, 'r') as f:
                      loaded = json.load(f)
                      hist['releases'] = loaded.get('releases', [])
                      hist['devBuilds'] = loaded.get('devBuilds', [])
              except Exception as e:
                  print(f"Warning reading history: {e}")

          # Update appropriate channel
          if current.get('isRelease'):
              # Filter out existing with same ID or version
              hist['releases'] = [r for r in hist['releases'] if r.get('id') != current['id']]
              hist['releases'] = [current] + hist['releases'][:3] # keep up to 4 releases
          else:
              hist['devBuilds'] = [d for d in hist['devBuilds'] if d.get('id') != current['id']]
              hist['devBuilds'] = [current] + hist['devBuilds'][:1] # keep latest dev build

          # Tag releases
          for idx, r in enumerate(hist['releases']):
              r['tag'] = 'Latest Release' if idx == 0 else f'Previous Release (n-{idx})'
              r['isLatest'] = (idx == 0)

          for d in hist['devBuilds']:
              d['tag'] = 'Dev Build (main)'
              d['isLatest'] = False

          # Reconstruct flattened builds list with releases first (recommended)
          combined_builds = hist['releases'] + hist['devBuilds']

          # Default selection: latest release if available, else latest dev
          default_id = hist['releases'][0]['id'] if hist['releases'] else (hist['devBuilds'][0]['id'] if hist['devBuilds'] else current['id'])

          # Copy cached builds from build_history/builds into site/builds/
          os.makedirs('site/builds', exist_ok=True)
          valid_ids = {b['id'] for b in combined_builds}
          for b_id in valid_ids:
              src = os.path.join('build_history', 'builds', b_id)
              dst = os.path.join('site', 'builds', b_id)
              if os.path.isdir(src) and not os.path.exists(dst):
                  shutil.copytree(src, dst)

          # Copy default manifest to root manifest.json
          default_manifest_src = os.path.join('site', 'builds', default_id, 'manifest.json')
          if os.path.exists(default_manifest_src):
              shutil.copyfile(default_manifest_src, 'site/manifest.json')

          index_data = {
              'latestRelease': hist['releases'][0]['version'] if hist['releases'] else None,
              'defaultId': default_id,
              'releases': hist['releases'],
              'devBuilds': hist['devBuilds'],
              'builds': combined_builds
          }

          with open('site/builds.json', 'w') as f:
              json.dump(index_data, f, indent=2)

          # Update build_history cache
          os.makedirs('build_history/builds', exist_ok=True)
          with open('build_history/builds.json', 'w') as f:
              json.dump(index_data, f, indent=2)

          current_build_dir = os.path.join('site', 'builds', current['id'])
          hist_current_dir = os.path.join('build_history', 'builds', current['id'])
          if os.path.isdir(current_build_dir):
              if os.path.exists(hist_current_dir):
                  shutil.rmtree(hist_current_dir)
              shutil.copytree(current_build_dir, hist_current_dir)

          # Prune expired builds from build_history
          for item in os.listdir('build_history/builds'):
              if item not in valid_ids:
                  p = os.path.join('build_history', 'builds', item)
                  if os.path.isdir(p):
                      shutil.rmtree(p)
          EOF

      - name: Save builds history cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: build_history
          key: firmware-build-history-${{ github.run_id }}

      - name: Add flasher page
        run: cp docs/index.html site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: assemble
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
