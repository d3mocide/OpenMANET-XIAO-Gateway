name: Build firmware and deploy web flasher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        # Regulatory domain, baked into the firmware at build time via
        # CONFIG_HALOW_COUNTRY_CODE (see country-configs/*.defaults) - this
        # can't be a runtime/gwcfg-* setting, so each region needs its own
        # binary. Add an ISO 3166-1 alpha-2 entry here + a matching
        # country-configs/<CODE>.defaults once it's confirmed to build.
        country: [US]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builds inside the official espressif/idf Docker image for the pinned
      # version - avoids the local-toolchain gotchas found setting this up by
      # hand (see design/PROGRESS.md): missing libusb for openocd, the Python
      # venv step silently not completing, etc.
      - name: Build firmware (country=${{ matrix.country }})
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
          path: "."
          command: idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;country-configs/${{ matrix.country }}.defaults" build

      - name: Assemble region manifest + binaries
        run: |
          set -eu
          REGION="$(echo "${{ matrix.country }}" | tr '[:upper:]' '[:lower:]')"
          mkdir -p "region/${REGION}"
          cp build/bootloader/bootloader.bin "region/${REGION}/"
          cp build/partition_table/partition-table.bin "region/${REGION}/"
          cp build/xiao_halow_gateway.bin "region/${REGION}/"

          VERSION="$(git rev-parse --short HEAD)"
          cat > "region/${REGION}/manifest.json" <<EOF
          {
            "name": "XIAO HaLow Gateway (${{ matrix.country }})",
            "version": "${VERSION}",
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "bootloader.bin", "offset": 0 },
                  { "path": "partition-table.bin", "offset": 32768 },
                  { "path": "xiao_halow_gateway.bin", "offset": 65536 }
                ]
              }
            ]
          }
          EOF

      - name: Upload region artifact
        uses: actions/upload-artifact@v4
        with:
          name: region-${{ matrix.country }}
          path: region

  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all region artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: region-*
          path: site
          merge-multiple: true

      - name: Add flasher page
        run: cp docs/index.html site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
