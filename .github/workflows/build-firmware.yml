name: Build firmware and deploy web flasher

on:
  push:
    branches: [main]
  # Build on PRs too. Without this a branch can be broken all the way to merge
  # and the first sign of it is a failed deploy on main - which is also the
  # moment the web flasher stops getting new firmware. PRs build one region
  # only (see the matrix below) and never deploy.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keyed by ref so a PR build doesn't cancel main's deploy, or vice versa.
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        # Regulatory domain, baked into the firmware at build time via
        # CONFIG_HALOW_COUNTRY_CODE (see country-configs/*.defaults) - this
        # can't be a runtime/gwcfg-* setting, so each region needs its own
        # binary. This list is exactly the 9 domains Morse Micro's regdb
        # (mmregdb.c, upstream of morsemicro/halow) actually ships channel
        # tables for - not an arbitrary/expandable country list. Adding an
        # entry here requires a matching country-configs/<CODE>.defaults AND
        # a real regdb entry for that code upstream; other countries aren't
        # buildable until Morse Micro ships regulatory data for them.
        #
        # Pull requests build US only. The regions differ by exactly one
        # Kconfig string, so nine builds of the same source find nine copies of
        # the same compile error - one is enough to gate a merge, and the full
        # matrix still runs on main where the artifacts are actually published.
        country: ${{ fromJSON(github.event_name == 'pull_request' && '["US"]' || '["US","CA","EU","GB","AU","NZ","JP","KR","IN"]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builds inside the official espressif/idf Docker image for the pinned
      # version - avoids the local-toolchain gotchas found setting this up by
      # hand (see design/PROGRESS.md): missing libusb for openocd, the Python
      # venv step silently not completing, etc.
      - name: Build firmware (country=${{ matrix.country }})
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
          path: "."
          command: idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;country-configs/${{ matrix.country }}.defaults" build

      - name: Assemble region manifest + binaries
        run: |
          set -eu
          REGION="$(echo "${{ matrix.country }}" | tr '[:upper:]' '[:lower:]')"
          mkdir -p "region/${REGION}"
          cp build/bootloader/bootloader.bin "region/${REGION}/"
          cp build/partition_table/partition-table.bin "region/${REGION}/"
          cp build/ota_data_initial.bin "region/${REGION}/"
          cp build/xiao_halow_gateway.bin "region/${REGION}/"

          # The offsets below MUST match partitions.csv. They are not the
          # defaults: this is a dual-OTA layout, so the app lives at 0x20000
          # (131072) rather than the 0x10000 a single-app table would use, and
          # otadata at 0x10000 (65536) gets the generated ota_data_initial.bin
          # so a freshly flashed board boots ota_0 instead of chasing stale
          # OTA state left in flash. Getting these wrong yields a flash that
          # reports success and then doesn't boot, so assert them against the
          # build's own flash_args rather than trusting this heredoc.
          BOOTLOADER_OFFSET=0
          PARTITION_TABLE_OFFSET=32768
          OTADATA_OFFSET=65536
          APP_OFFSET=131072

          # Match offset AND filename together on the same flash_args line.
          # Checking the offset alone is not enough: with the app at the old
          # 0x10000 that check still passes, because otadata now occupies
          # 0x10000 - i.e. it would wave through the exact regression this
          # guard exists to catch.
          check_part() {
            offset="$(printf '0x%x' "$1")"
            file="$2"
            if ! grep -qiE "^${offset}[[:space:]]+(.*/)?${file}\$" build/flash_args; then
              echo "::error::flash_args has no '${file}' at ${offset}; partitions.csv and this manifest disagree"
              cat build/flash_args
              exit 1
            fi
          }
          check_part "$BOOTLOADER_OFFSET" bootloader.bin
          check_part "$PARTITION_TABLE_OFFSET" partition-table.bin
          check_part "$OTADATA_OFFSET" ota_data_initial.bin
          check_part "$APP_OFFSET" xiao_halow_gateway.bin

          VERSION="$(git rev-parse --short HEAD)"
          cat > "region/${REGION}/manifest.json" <<EOF
          {
            "name": "XIAO HaLow Gateway (${{ matrix.country }})",
            "version": "${VERSION}",
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "bootloader.bin", "offset": ${BOOTLOADER_OFFSET} },
                  { "path": "partition-table.bin", "offset": ${PARTITION_TABLE_OFFSET} },
                  { "path": "ota_data_initial.bin", "offset": ${OTADATA_OFFSET} },
                  { "path": "xiao_halow_gateway.bin", "offset": ${APP_OFFSET} }
                ]
              }
            ]
          }
          EOF

      - name: Upload region artifact
        uses: actions/upload-artifact@v4
        with:
          name: region-${{ matrix.country }}
          path: region

  # Publishing steps only. A PR build stops after `build` above: it proves the
  # firmware compiles without touching the live flasher page.
  assemble:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all region artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: region-*
          path: site
          merge-multiple: true

      - name: Add flasher page
        run: cp docs/index.html site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: assemble
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
